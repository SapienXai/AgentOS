<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>AgentOS Secure Browser</title>
    <style>
      :root {
        color-scheme: dark;
        background: #05070c;
      }

      html,
      body,
      #screen {
        width: 100%;
        height: 100%;
        min-width: 0;
        min-height: 0;
        margin: 0;
        overflow: auto;
        overscroll-behavior: contain;
        background: #05070c;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #screen:focus {
        outline: none;
      }

      #screen > div {
        margin: auto;
      }
    </style>
    <script type="module" src="/secure-browser-client.js"></script>
  </head>
  <body>
    <div id="screen" tabindex="-1" aria-label="Secure remote browser"></div>
  </body>
</html>
