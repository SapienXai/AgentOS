name: AgentOS Desktop Release Assets

on:
  workflow_call:
    inputs:
      production:
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: linux
            os: ubuntu-22.04
          - name: macOS ARM64
            platform: macos-arm64
            os: macos-15
          - name: Windows x64
            platform: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Prepare and audit packaged AgentOS
        run: pnpm desktop:prepare && pnpm desktop:audit && pnpm desktop:check

      - name: Smoke packaged AgentOS server
        run: pnpm desktop:smoke

      - name: Build signed Desktop bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm exec tauri build --config apps/desktop/src-tauri/tauri.conf.json

      - name: Verify macOS app bundle seal
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/src-tauri/target/release/bundle/macos/AgentOS.app

      - name: Verify macOS distribution signing and notarization
        if: inputs.production && runner.os == 'macOS'
        shell: bash
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/AgentOS.app
          codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"

      - name: Verify Windows installer Authenticode
        if: inputs.production && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $signature = Get-AuthenticodeSignature -FilePath $installers[0].FullName
          if ($signature.Status -ne 'Valid') { throw "Windows installer signature is $($signature.Status)." }

      - uses: actions/upload-artifact@v6
        with:
          name: agentos-desktop-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error
