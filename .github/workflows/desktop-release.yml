name: AgentOS Desktop Release Assets

on:
  workflow_call:
    inputs:
      production:
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            platform: linux
            os: ubuntu-22.04
          - name: macOS ARM64
            platform: macos-arm64
            os: macos-15
          - name: Windows x64
            platform: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3

      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Require updater signing credentials
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Prepare and audit packaged AgentOS
        run: pnpm desktop:prepare && pnpm desktop:audit && pnpm desktop:check

      - name: Smoke packaged AgentOS server
        run: pnpm desktop:smoke

      - name: Install Windows distribution signer
        if: inputs.production && runner.os == 'Windows'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked

      - name: Build Desktop bundles and sign updater payloads
        shell: bash
        env:
          DISTRIBUTION_SIGNING: ${{ inputs.production }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ "$DISTRIBUTION_SIGNING" != "true" || "$RUNNER_OS" == "Linux" ]]; then
            pnpm exec tauri build --config apps/desktop/src-tauri/tauri.conf.json
          fi

      - name: Sign and notarize macOS distribution bundles
        if: inputs.production && runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing macOS distribution signing input $name." >&2
              exit 1
            fi
          done
          [[ "$APPLE_SIGNING_IDENTITY" == "Developer ID Application: "* ]]
          overrides="$(node -e 'console.log(JSON.stringify({bundle:{macOS:{signingIdentity:process.env.APPLE_SIGNING_IDENTITY}}}))')"
          pnpm exec tauri build --config apps/desktop/src-tauri/tauri.conf.json --config "$overrides"
          for dmg in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
          done

      - name: Sign Windows distribution bundles
        if: inputs.production && runner.os == 'Windows'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE; do
            if [[ -z "${!name}" ]]; then
              echo "Missing Windows distribution signing input $name." >&2
              exit 1
            fi
          done
          config="$RUNNER_TEMP/agentos-windows-sign.json"
          node - "$config" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const signCommand = {
            cmd: "artifact-signing-cli",
            args: [
              "-e", process.env.AZURE_ARTIFACT_SIGNING_ENDPOINT,
              "-a", process.env.AZURE_ARTIFACT_SIGNING_ACCOUNT,
              "-c", process.env.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE,
              "-d", "AgentOS", "%1"
            ]
          };
          writeFileSync(process.argv[2], JSON.stringify({ bundle: { windows: { signCommand } } }));
          NODE
          pnpm exec tauri build --config apps/desktop/src-tauri/tauri.conf.json --config "$config"

      - name: Verify macOS app bundle seal
        if: runner.os == 'macOS'
        shell: bash
        run: codesign --verify --deep --strict --verbose=2 apps/desktop/src-tauri/target/release/bundle/macos/AgentOS.app

      - name: Verify macOS distribution signing and notarization
        if: inputs.production && runner.os == 'macOS'
        shell: bash
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/AgentOS.app
          codesign -dvv "$app" 2>&1 | grep -q '^Authority=Developer ID Application:'
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          for dmg in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done

      - name: Verify Windows installer Authenticode
        if: inputs.production && runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem apps/desktop/src-tauri/target/release/bundle/nsis -Filter '*setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $executable = 'apps/desktop/src-tauri/target/release/agentos-desktop.exe'
          foreach ($path in @($installers[0].FullName, $executable)) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($signature.Status -ne 'Valid' -or !$signature.TimeStamperCertificate) {
              throw "Expected a valid timestamped Authenticode signature on $path."
            }
          }

      - uses: actions/upload-artifact@v6
        with:
          name: agentos-desktop-${{ matrix.platform }}
          path: apps/desktop/src-tauri/target/release/bundle
          if-no-files-found: error
