name: Publish AgentOS

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  actions: read

concurrency:
  group: agentos-publication
  cancel-in-progress: false

jobs:
  production-gate:
    if: github.ref == 'refs/heads/main' && github.repository == 'SapienXai/AgentOS'
    runs-on: ubuntu-latest
    outputs:
      source_run: ${{ steps.plan.outputs.source_run }}
      source_artifact: ${{ steps.plan.outputs.source_artifact }}
      source_digest: ${{ steps.plan.outputs.source_digest }}
      cli_smokes: ${{ steps.plan.outputs.cli_smokes }}
      windows_asset: ${{ steps.plan.outputs.windows_asset }}
      debian_asset: ${{ steps.plan.outputs.debian_asset }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require passing main CI and certified release provenance
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ci="$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --limit 1 --json conclusion --jq '.[0].conclusion')"
          test "$ci" = success
          pnpm check:release
          pnpm --silent check:production-release --plan > release-plan.json
          run="$(jq -r '.source.runId' release-plan.json)"
          artifact="$(jq -r '.source.id' release-plan.json)"
          digest="$(jq -r '.source.sha256' release-plan.json)"
          commit="$(jq -r '.commit' release-plan.json)"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" | jq -e --arg commit "$commit" '
            .head_sha == $commit and .conclusion == "success" and .path == ".github/workflows/release-agentos.yml"'
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact" | jq -e --argjson run "$run" --arg digest "sha256:$digest" '
            .workflow_run.id == $run and .name == "finalized-agentos-release" and .digest == $digest and .expired == false'
          {
            echo "source_run=$run"
            echo "source_artifact=$artifact"
            echo "source_digest=$digest"
            echo "cli_smokes=$(jq -c '.cliSmokes' release-plan.json)"
            echo "windows_asset=$(jq -r '.desktop[] | select(.target == "windows-x86_64-nsis" and .channel != "withheld").name' release-plan.json)"
            echo "debian_asset=$(jq -r '.desktop[] | select(.target == "linux-x86_64-deb" and .channel != "withheld").name' release-plan.json)"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: publication-plan
          path: release-plan.json
          if-no-files-found: error

  cli-smoke:
    name: Verify CLI (${{ matrix.target }})
    needs: production-gate
    if: needs.production-gate.outputs.cli_smokes != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.production-gate.outputs.cli_smokes) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.production-gate.outputs.source_run }}
          name: agentos-${{ matrix.target }}
          path: verified
      - name: Check the archive, clean install and read-only update check
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          node scripts/publish-agentos-release.mjs verify-cli verified "$TARGET"
          node packages/agentos/scripts/smoke-package.mjs --tarball "verified/agentos-$TARGET.tgz" --check-update
          node scripts/publish-agentos-release.mjs verify-cli verified "$TARGET" "cli-$TARGET.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: publication-proof-cli-${{ matrix.target }}
          path: cli-${{ matrix.target }}.txt
          if-no-files-found: error

  windows-installer:
    needs: production-gate
    if: needs.production-gate.outputs.windows_asset != ''
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.production-gate.outputs.source_run }}
          name: agentos-desktop-windows-x64
          path: desktop
      - name: Install NSIS package and launch the installed app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem desktop -Recurse -Filter '*setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected one Windows installer.' }
          $installer = $installers[0].FullName
          $destination = Join-Path $env:RUNNER_TEMP 'AgentOS-public-install'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed ($($process.ExitCode))." }
          $wrapper = @(Get-ChildItem $destination -Recurse -Filter 'agentos-desktop-server.cjs')
          $application = Join-Path $destination 'agentos-desktop.exe'
          if ($wrapper.Count -ne 1 -or !(Test-Path $application)) {
            throw 'Installed shell or runtime is missing.'
          }
          node scripts/desktop/smoke.mjs $wrapper[0].Directory.Parent.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = Start-Process -FilePath $application -WorkingDirectory $destination -PassThru
          try {
            $deadline = (Get-Date).AddSeconds(75)
            $ready = $false
            do {
              $app.Refresh()
              if ($app.HasExited) { throw 'Desktop shell exited during startup.' }
              $nodes = @(Get-CimInstance Win32_Process -Filter "ParentProcessId=$($app.Id) AND Name='node.exe'")
              foreach ($child in $nodes) {
                $listeners = @(Get-NetTCPConnection -OwningProcess $child.ProcessId -State Listen -ErrorAction SilentlyContinue)
                foreach ($listener in $listeners) {
                  if ($listener.LocalAddress -ne '127.0.0.1') { throw 'Embedded server is listening outside loopback.' }
                  try {
                    $status = Invoke-WebRequest -Uri "http://127.0.0.1:$($listener.LocalPort)/api/auth/status" -TimeoutSec 3
                    $ready = $status.StatusCode -eq 200
                  } catch {
                    # Next.js can start listening before routes are ready.
                  }
                }
              }
              if (!$ready) { Start-Sleep -Milliseconds 500 }
            } until ($ready -or (Get-Date) -ge $deadline)
            if (!$ready) { throw 'Installed desktop did not start its embedded server.' }
            Write-Output 'Installed desktop launched and its embedded loopback server returned HTTP 200.'
          } finally {
            try {
              $app.Refresh()
              if (!$app.HasExited -and (!$app.CloseMainWindow() -or !$app.WaitForExit(3000))) {
                $app.Kill($true)
              }
            } catch {
              Write-Warning 'The runner will clean up remaining Desktop processes.'
            }
          }
          (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant() | Set-Content desktop-windows-x86_64-nsis.txt -Encoding ascii
      - uses: actions/upload-artifact@v6
        with:
          name: publication-proof-windows-desktop
          path: desktop-windows-x86_64-nsis.txt
          if-no-files-found: error

  debian-installer:
    needs: production-gate
    if: needs.production-gate.outputs.debian_asset != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.production-gate.outputs.source_run }}
          name: agentos-desktop-linux
          path: desktop
      - name: Install the Debian package and check the embedded server
        shell: bash
        run: |
          mapfile -t installers < <(find desktop -type f -name '*.deb')
          test "${#installers[@]}" -eq 1
          sudo apt-get update
          sudo apt-get install -y xvfb "./${installers[0]}"
          xvfb-run -a bash -euo pipefail <<'EOF'
          agentos-desktop >/dev/null 2>&1 &
          app=$!
          trap 'kill "$app" 2>/dev/null || true; wait "$app" 2>/dev/null || true' EXIT
          for attempt in {1..75}; do
            kill -0 "$app" || exit 1
            for child in $(pgrep -P "$app" || true); do
              binary=$(readlink "/proc/$child/exe" 2>/dev/null || true)
              [[ "$binary" == */agentos-runtime/node/bin/node ]] || continue
              listeners=$(ss -H -ltnp | awk -v child="$child" '$0 ~ ("pid=" child ",") {print $4}')
              for address in $listeners; do
                [[ "$address" == 127.0.0.1:* ]] || exit 1
              done
              for address in $listeners; do
                if curl --fail --silent --max-time 2 "http://$address/api/auth/status" >/dev/null; then
                  echo "Installed Desktop returned HTTP 200 on loopback."
                  exit 0
                fi
              done
            done
            sleep 1
          done
          echo "Installed Desktop did not expose a ready loopback server within 75 seconds." >&2
          ps -o pid=,ppid=,comm= --ppid "$app" || true
          exit 1
          EOF
          sha256sum "${installers[0]}" | cut -d ' ' -f 1 > desktop-linux-x86_64-deb.txt
      - uses: actions/upload-artifact@v6
        with:
          name: publication-proof-debian-desktop
          path: desktop-linux-x86_64-deb.txt
          if-no-files-found: error

  publish:
    needs: [production-gate, cli-smoke, windows-installer, debian-installer]
    if: '!cancelled() && needs.production-gate.result == ''success'''
    runs-on: ubuntu-latest
    environment: agentos-public-release
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26.12.1
          package-manager-cache: false
      - uses: actions/download-artifact@v5
        with:
          name: publication-plan
          path: plan
      - uses: actions/download-artifact@v5
        with:
          pattern: publication-proof-*
          merge-multiple: true
          path: proofs
      - name: Verify immutable artifact, then publish accepted platforms
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT: ${{ needs.production-gate.outputs.source_artifact }}
          DIGEST: ${{ needs.production-gate.outputs.source_digest }}
        run: |
          mkdir -p proofs
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT/zip" > release.zip
          echo "$DIGEST  release.zip" | sha256sum --check --strict
          unzip -q release.zip -d release-assets
          sudo apt-get update
          sudo apt-get install -y minisign
          node scripts/publish-agentos-release.mjs publish plan/release-plan.json release-assets proofs
